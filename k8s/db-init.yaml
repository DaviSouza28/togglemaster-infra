apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: togglemaster

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: db-init

    spec:
      restartPolicy: Never
      serviceAccountName: db-init

      containers:
        - name: db-init
          image: 921017758649.dkr.ecr.us-east-1.amazonaws.com/togglemaster-db-init:v3
          imagePullPolicy: Always